<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Pagamentos HPG{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
  <header class="topo">
    <p class="marca">Pagamentos HPG</p>
    {% if current_user.is_authenticated %}
    <form method="post" action="{{ url_for('auth.logout') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <button type="submit" class="botao botao-contorno">Sair</button>
    </form>
    {% endif %}
  </header>
  <main class="conteudo">
    {% for categoria, texto in get_flashed_messages(with_categories=true) %}
    <div class="aviso aviso-{{ categoria }}" role="alert">{{ texto }}</div>
    {% endfor %}
    {% block conteudo %}{% endblock %}
  </main>
</body>
</html>
