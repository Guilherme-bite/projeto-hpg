{% extends "base.html" %}
{% block titulo %}Novo Pedido{% endblock %}
{% block conteudo %}
<h1>Novo Pedido</h1>
<form method="post" class="cartao">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="campo">
    <label>Número do Pedido</label>
    <input type="text" name="numero" required>
  </div>
  <div class="campo">
    <label>Cliente</label>
    <input type="text" name="cliente" required>
  </div>
  <div class="campo">
    <label>Valor Total (R$)</label>
    <input type="number" step="0.01" name="valor_total" required>
  </div>
  <button type="submit" class="botao botao-principal">Salvar Pedido</button>
  <a href="{{ url_for('pedidos.listar') }}" style="display:block; text-align:center; margin-top:10px; color:#5b6770;">Cancelar</a>
</form>
{% endblock %}
